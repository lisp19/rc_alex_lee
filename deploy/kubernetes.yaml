apiVersion: apps/v1
kind: Deployment
metadata: {name: notifier}
spec:
  replicas: 2
  selector:
    matchLabels: {app: notifier}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: notifier}
    spec:
      terminationGracePeriodSeconds: 55
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notifier
          image: notifier:review-required
          imagePullPolicy: IfNotPresent
          env:
            - {name: NOTIFIER_CONFIG, value: /etc/notifier/notifier.json}
            - {name: NOTIFIER_ROLES, value: 'api,worker,outbox,recovery'}
          envFrom:
            - secretRef: {name: notifier-connections}
          ports:
            - {name: api, containerPort: 8080}
            - {name: health, containerPort: 8081}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: '2', memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: health}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: health}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /health/live, port: health}
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/notifier, readOnly: true}
            - {name: secrets, mountPath: /etc/notifier-secrets, readOnly: true}
      volumes:
        - name: config
          configMap: {name: notifier-process}
        - name: secrets
          secret: {secretName: notifier-target-secrets, defaultMode: 288}
---
apiVersion: v1
kind: Service
metadata: {name: notifier}
spec:
  selector: {app: notifier}
  ports:
    - {name: api, port: 8080, targetPort: api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: notifier}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: notifier}
